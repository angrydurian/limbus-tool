name: 데이터 입력
on:
  issues:
    types: [opened, edited, reopened]
permissions:
  contents: write
  issues: write
concurrency:
  group: intake
  cancel-in-progress: false
jobs:
  intake:
    # 저장소 주인이 낸, 열려 있는 입력 이슈만
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.state == 'open' &&
      (contains(github.event.issue.labels.*.name, '기프트 입력') ||
       contains(github.event.issue.labels.*.name, '인격·E.G.O 입력'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      NUM: ${{ github.event.issue.number }}
      KIND: ${{ contains(github.event.issue.labels.*.name, '기프트 입력') && 'gift' || 'db' }}
      BODY: ${{ github.event.issue.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pillow
      - name: 처리
        id: run
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          if python3 -I tools/intake.py "$KIND" "$RUNNER_TEMP/body.md" "$RUNNER_TEMP/report.md"; then
            echo ok=1 >> "$GITHUB_OUTPUT"
          else
            echo ok=0 >> "$GITHUB_OUTPUT"
          fi
          cat "$RUNNER_TEMP/report.md"
      - name: main에 커밋
        if: steps.run.outputs.ok == '1'
        run: |
          if [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A gifts data
          what=$([ "$KIND" = gift ] && echo "기프트" || echo "인격·E.G.O")
          git commit -q -m "데이터: $what 입력 $(cat "$RUNNER_TEMP/report.md.count")개 (#$NUM)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
      - name: 결과 댓글
        if: always()
        run: |
          if [ "${{ steps.run.outputs.ok }}" != "1" ] && [ ! -s "$RUNNER_TEMP/report.md" ]; then
            echo "❌ 자동 처리 중 오류가 났어요. Actions 기록을 확인해 주세요: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/report.md"
          fi
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/report.md"
          if [ "${{ steps.run.outputs.ok }}" = "1" ] && [ "${{ job.status }}" != "failure" ]; then
            gh issue edit "$NUM" --repo "$GITHUB_REPOSITORY" --remove-label "확인 필요" || true
            gh issue close "$NUM" --repo "$GITHUB_REPOSITORY"
          else
            gh issue edit "$NUM" --repo "$GITHUB_REPOSITORY" --add-label "확인 필요"
          fi
