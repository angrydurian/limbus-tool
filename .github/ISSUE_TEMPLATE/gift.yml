name: 기프트 추가·수정
description: 나무위키 E.G.O 기프트 글과 아이콘 캡처를 넣으면 자동으로 gifts.json에 반영해요.
title: "[기프트] "
labels: ["기프트 입력"]
body:
  - type: markdown
    attributes:
      value: |
        제출하면 자동 처리가 데이터에 넣고 결과를 댓글로 남겨요. 잘 들어가면 이슈가 닫혀요.
        문제가 있으면 '확인 필요'가 붙어요. 이슈 내용을 고쳐 저장하면 다시 처리해요.
  - type: textarea
    id: wiki
    attributes:
      label: 위키 글
      description: 나무위키 기프트 상자를 글자로 복사해 붙여 넣어요. 여러 개를 이어 붙여도 돼요. (아이콘이나 팩만 고칠 때는 비워도 돼요)
      placeholder: |
        Ⅳ 영구동력 서보모터
        림버스 컴퍼니 코스트 ...
  - type: textarea
    id: icons
    attributes:
      label: 아이콘 캡처
      description: 기프트 상자 윗부분 캡처를 끌어다 놓아요. 위키 글에 나온 기프트 순서대로 한 장씩 넣어요.
  - type: textarea
    id: names
    attributes:
      label: 아이콘 대상 이름
      description: (선택) 캡처 순서가 위키 글과 다르거나 아이콘만 고칠 때, 기프트 이름을 캡처 순서대로 한 줄에 하나씩 적어요.
  - type: textarea
    id: packs
    attributes:
      label: 팩 지정
      description: (선택) 위키 글로 팩을 알 수 없을 때 한 줄에 하나씩 적어요.
      placeholder: 민무늬 코등이 = 팩 이름
