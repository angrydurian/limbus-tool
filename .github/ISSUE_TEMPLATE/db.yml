name: 인격·E.G.O 추가·수정
description: Claude가 캡처로 만들어 준 JSON이나 사이트의 '변경분 복사' 내용을 넣으면 data/db에 반영해요.
title: "[인격·E.G.O] "
labels: ["인격·E.G.O 입력"]
body:
  - type: markdown
    attributes:
      value: |
        캡처 사진은 Claude 채팅에 보내서 JSON으로 받은 뒤, 그 JSON을 아래에 붙여 넣어요.
        같은 수감자·이름이 이미 있으면 그 항목을 고쳐요. 확인 필요(uncertain) 항목이 남아 있으면 넣지 않아요.
  - type: textarea
    id: json
    attributes:
      label: JSON
      description: '{"identity":...} 또는 {"ego":...}를 여러 개 이어 붙여도 돼요. 코드 블록(```)째 붙여도 돼요.'
      render: json
    validations:
      required: true
  - type: textarea
    id: memo
    attributes:
      label: 메모
      description: (선택) 남길 말
